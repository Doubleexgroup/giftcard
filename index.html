<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas Card | Dinner in the Sky</title>
<meta name="description" content="La Christmas Card Dinner in the Sky: il regalo per chi merita un'esperienza indimenticabile.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --logo-height:50px;
  --logo-azienda-height:42px;
  --accent:#2fa8dc;
  --accent-h:#4dbbea;
  --font:'Montserrat','Helvetica Neue',Arial,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
  font:400 .95rem/1.6 var(--font);
  background:#05070a;
  overflow-x:hidden;
}

img{max-width:100%;display:block}
a{color:inherit}
[hidden]{display:none!important}

h1,h2,h3{
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.04em;
  line-height:1.15;
}

/* =========================================
   STRUTTURA GENERALE
========================================= */

.page{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}

/* =========================================
   PARTE ALTA
   Immagine di sfondo + logo + titolo
========================================= */

.top-panel{
  position:relative;
  min-height:340px;
  padding:20px 4vw 35px;
  display:flex;
  flex-direction:column;
  background-color:#101820;
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
  isolation:isolate;
}

.top-panel:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    rgba(0,0,0,.35),
    rgba(0,0,0,.18) 45%,
    rgba(0,0,0,.48)
  );
  z-index:-1;
}

.top{
  width:100%;
  display:flex;
  justify-content:flex-start;
  align-items:center;
}

.logo{display:inline-block}

.logo img{
  height:var(--logo-height);
  width:auto;
  filter:drop-shadow(0 2px 12px rgba(0,0,0,.5));
}

.top-title{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px 15px 10px;
}

.top-title h1{
  max-width:1000px;
  font-size:clamp(2rem,4.5vw,4rem);
  color:#fff;
  text-shadow:0 4px 25px rgba(0,0,0,.65);
}

/* =========================================
   PARTE CENTRALE BIANCA
========================================= */

.hero-panel{
  background:#fff;
  color:#20252a;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:35px 22px 40px;
  min-height:440px;
}

.hero{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
}

.eyebrow{
  font:600 .72rem var(--font);
  letter-spacing:.3em;
  text-transform:uppercase;
  color:var(--accent);
}

.eyebrow:empty{display:none}

.hero-img{
  width:auto;
  height:auto;
  max-width:min(640px,90vw);
  max-height:min(42vh,360px);
  object-fit:contain;
  filter:drop-shadow(0 5px 16px rgba(0,0,0,.16));
}

.lead{
  max-width:34em;
  font-size:clamp(.9rem,1.1vw + .3vh,1.08rem);
  color:#555;
  text-shadow:none;
}

/* Pulsante acquista */

.cta{
  display:inline-block;
  padding:16px 44px;
  border-radius:999px;
  color:#fff;
  text-decoration:none;
  font:600 .82rem var(--font);
  letter-spacing:.14em;
  text-transform:uppercase;
  background:var(--accent);
  transition:background .2s,transform .2s;
}

.cta:hover{
  background:var(--accent-h);
  transform:translateY(-2px);
}

/* =========================================
   PARTE INFERIORE
   Sfondo personalizzabile
========================================= */

.bottom-panel{
  background-color:#101820;
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
  color:#fff;
  position:relative;
  isolation:isolate;
}

.bottom-panel:before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.48);
  z-index:-1;
}

/* Tre punti informativi */

.points{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:26px;
  max-width:1080px;
  width:100%;
  margin:0 auto;
  padding:35px 25px 30px;
}

.points div{
  border-top:2px solid var(--accent);
  padding-top:12px;
}

.points h3{
  font-size:.92rem;
  margin-bottom:6px;
  color:#fff;
}

.points p{
  font-size:.8rem;
  line-height:1.5;
  color:rgba(255,255,255,.82);
}

/* =========================================
   FOOTER
========================================= */

.foot{
  background:rgba(0,0,0,.72);
  border-top:1px solid rgba(255,255,255,.15);
  padding:18px max(20px,3vw) max(14px,env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:22px;
  align-items:center;
  font-size:.76rem;
  color:rgba(255,255,255,.75);
}

.foot .azienda-logo{
  grid-column:1;
  justify-self:start;
}

.foot .azienda-logo img{
  height:var(--logo-azienda-height);
  width:auto;
}

.foot .dati{
  grid-column:2;
  text-align:center;
}

.foot .links{grid-column:3}

.foot .dati strong{
  color:#fff;
  font-weight:600;
}

.foot a{text-decoration:none}

.foot a:hover{
  color:var(--accent);
  text-decoration:underline;
}

.foot .links{
  display:flex;
  flex-direction:column;
  gap:3px;
  text-align:right;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-weight:500;
}

.copy{
  grid-column:1/-1;
  text-align:center;
  font-size:.7rem;
  opacity:.65;
  border-top:1px solid rgba(255,255,255,.12);
  padding-top:10px;
}

/* =========================================
   MODALITA' SFONDO UNICO
========================================= */

.page.modalita-unico{
  background-position:center;
  background-size:cover;
  background-attachment:scroll;
  background-repeat:no-repeat;
}

.page.modalita-unico .top-panel{
  background:transparent!important;
}

.page.modalita-unico .top-panel:before{
  background:rgba(0,0,0,.38);
}

.page.modalita-unico .hero-panel{
  background:rgba(255,255,255,.92);
}

.page.modalita-unico .bottom-panel{
  background:transparent!important;
}

.page.modalita-unico .bottom-panel:before{
  background:rgba(0,0,0,.55);
}

/* =========================================
   SMARTPHONE E TABLET
========================================= */

@media(max-width:820px){

  :root{
    --logo-height:38px;
    --logo-azienda-height:34px;
  }

  .top-panel{
    min-height:270px;
    padding:15px 18px 25px;
  }

  .top-title{
    padding:25px 5px 5px;
  }

  .top-title h1{
    font-size:clamp(1.7rem,7vw,2.7rem);
  }

  .hero-panel{
    min-height:390px;
    padding:28px 16px 32px;
  }

  .hero{
    gap:14px;
  }

  .hero-img{
    max-width:94vw;
    max-height:36vh;
  }

  .cta{
    padding:15px 28px;
    font-size:.75rem;
  }

  .points{
    grid-template-columns:1fr;
    gap:16px;
    padding:25px 22px;
  }

  .points h3{font-size:.84rem}

  .points p{
    font-size:.78rem;
    line-height:1.5;
  }

  .foot{
    grid-template-columns:1fr;
    text-align:center;
    gap:10px;
    padding:18px 15px;
  }

  .foot .azienda-logo,
  .foot .dati,
  .foot .links{
    grid-column:auto;
  }

  .foot .azienda-logo{
    display:flex;
    justify-content:center;
    justify-self:center;
  }

  .foot .links{
    flex-direction:row;
    justify-content:center;
    gap:16px;
    text-align:center;
  }

  .copy{grid-column:auto}
}

/* Schermi bassi: non nascondere la Christmas Card */
@media(max-height:480px) and (min-width:821px){
  .hero-panel{padding-top:20px;padding-bottom:20px}
  .hero-img{max-height:30vh}
}

@media(prefers-reduced-motion:reduce){
  .cta{transition:none}
}
</style>
</head>

<body>

<div class="page" id="pagina">

  <!-- =====================================
       PARTE ALTA: LOGO E TITOLO
  ====================================== -->

  <header class="top-panel" id="pannelloAlto">

    <div class="top">
      <a class="logo" id="logo" hidden>
        <img id="logoImg" alt="">
      </a>
    </div>

    <div class="top-title">
      <h1 id="titolo"></h1>
    </div>

  </header>

  <!-- =====================================
       PARTE CENTRALE BIANCA: CARD E ACQUISTA
  ====================================== -->

  <main class="hero-panel">

    <div class="hero">

      <div class="eyebrow" data-t="sopratitolo"></div>

      <img class="hero-img" id="heroImg" alt="" hidden>

      <a class="cta" id="bottone"
         target="_blank"
         rel="noopener noreferrer"></a>

      <p class="lead" data-t="sottotitolo"></p>

    </div>

  </main>

  <!-- =====================================
       PARTE INFERIORE: PUNTI E FOOTER
  ====================================== -->

  <section class="bottom-panel" id="pannelloBasso">

    <section class="points">

      <div>
        <h3 data-t="punto1Titolo"></h3>
        <p data-t="punto1Testo"></p>
      </div>

      <div>
        <h3 data-t="punto2Titolo"></h3>
        <p data-t="punto2Testo"></p>
      </div>

      <div>
        <h3 data-t="punto3Titolo"></h3>
        <p data-t="punto3Testo"></p>
      </div>

    </section>

    <footer class="foot">

      <a class="azienda-logo" id="aziendaLogoLink" hidden>
        <img id="aziendaLogo" alt="">
      </a>

      <div class="dati" id="dati"></div>

      <nav class="links" aria-label="Informazioni">
        <a id="linkFaq" target="_blank" rel="noopener"></a>
        <a id="linkCond" target="_blank" rel="noopener"></a>
      </nav>

      <p class="copy" data-t="copyright"></p>

    </footer>

  </section>

</div>

<!-- =========================================
     IMPOSTAZIONI
     MODIFICA LE IMMAGINI E I TESTI QUI
========================================= -->

<script>

var IMPOSTAZIONI = {

  /* =====================================
     MODALITA' SFONDO

     "tre-zone" = tre fasce distinte
     "unico"    = una sola immagine su tutta la pagina
  ====================================== */

  modalitaSfondo: "tre-zone",

  /* =====================================
     IMMAGINE PARTE ALTA

     Mantiene l'immagine natalizia attuale
  ====================================== */

  sfondo: "IMG/Cena sospesa sul Natale di Roma.png",

  /* =====================================
     IMMAGINE PARTE BASSA

     Inserisci il percorso di un'immagine.
     Lascia "" per usare soltanto il colore.
  ====================================== */

  sfondoInferiore: "",

  /* Colore della parte inferiore se non usi un'immagine */

  coloreInferiore: "#101820",

  /* =====================================
     LOGHI
  ====================================== */

  logo: "IMG/Logo Dinner in the Sky Italy_1.png",

  logoAlt: "Dinner in the Sky",

  logoLink: "https://www.dinnerinthesky.it",

  logoAzienda: "IMG/Logo Dinner in the Sky Italy_1.png",

  logoAziendaAlt: "Dinner in the Sky Italia",

  logoAziendaLink: "",

  /* =====================================
     CARD CENTRALE
  ====================================== */

  immagineTitolo: "IMG/Biglietto regalo Dinner in the Sky natalizio.png",

  immagineTitoloAlt: "",

  /* =====================================
     TESTI
  ====================================== */

  titoloPagina: "Christmas Card | Dinner in the Sky",

  descrizioneSfondo: "Christmas Card Dinner in the Sky",

  sopratitolo: "",

  titolo: '<span style="color:#ffffff;">Regala un’esperienza all’</span><span style="color:#2fa8dc;font-style:italic;">ALTEZZA</span><br><span style="color:#ffffff;">di Babbo Natale</span>',

  sottotitolo: "Il regalo per chi merita un'esperienza indimenticabile.",

  /* =====================================
     PULSANTE ACQUISTA
  ====================================== */

  bottoneTesto: "Acquista la Christmas Card",

  bottoneLink: "https://www.dinnerinthesky.it/gift-card#scegli-il-valore",

  /* =====================================
     TRE PUNTI INFORMATIVI
  ====================================== */

  punto1Titolo: "Scegli il valore",

  punto1Testo: "Quest'anno il valore del regalo lo scegli tu. Seleziona l'importo ideale e preparati a lasciare sotto l'albero un'emozione.",

  punto2Titolo: "Regalala subito",

  punto2Testo: "Come un pacco speciale che arriva a sorpresa, ma digitale: la Christmas Card entra nella casella email che scegli tu, la tua o quella di chi la riceve.",

  punto3Titolo: "Stupisci chi vuoi",

  punto3Testo: "Chi la scarta non riceve un oggetto, ma un'esperienza fuori dall'ordinario ed un panorama che non si dimentica.",

  /* =====================================
     DATI AZIENDALI
  ====================================== */

  ragioneSociale: "DINNER IN THE SKY ITALIA SRL",

  indirizzo: "Via Pomarico 58, 00178 Roma (RM)",

  piva: "18589811001",

  email: "supporto@dinnerinthesky.it",

  telefono: "+39 342 798 2112",

  telefonoLink: "+393427982112",

  /* =====================================
     FAQ E CONDIZIONI
  ====================================== */

  testoFaq: "FAQ",

  linkFaq: "faq.html",

  testoCondizioni: "Condizioni contrattuali",

  linkCondizioni: "condizioni.html",

  /* =====================================
     COPYRIGHT
  ====================================== */

  copyright: "© 2026 DINNER IN THE SKY ITALIA SRL · Tutti i diritti riservati"

};


/* =========================================
   APPLICAZIONE DELLE IMPOSTAZIONI
========================================= */

(function(){

  var C = IMPOSTAZIONI;

  var $ = function(id){
    return document.getElementById(id);
  };

  var pagina = $("pagina");
  var pannelloAlto = $("pannelloAlto");
  var pannelloBasso = $("pannelloBasso");

  /* Titolo della scheda */

  document.title = C.titoloPagina;

  /* Descrizione */

  pagina.setAttribute("aria-label", C.descrizioneSfondo || "");

  /* =====================================
     GESTIONE SFONDI
  ====================================== */

  if(C.modalitaSfondo === "unico"){

    pagina.classList.add("modalita-unico");

    if(C.sfondo){
      pagina.style.backgroundImage =
        "linear-gradient(rgba(0,0,0,.20),rgba(0,0,0,.20)),url(" +
        JSON.stringify(C.sfondo) + ")";
    }

  }else{

    /* Sfondo superiore */

    if(C.sfondo){
      pannelloAlto.style.backgroundImage =
        "url(" + JSON.stringify(C.sfondo) + ")";
    }

    /* Sfondo inferiore */

    if(C.sfondoInferiore){
      pannelloBasso.style.backgroundImage =
        "url(" + JSON.stringify(C.sfondoInferiore) + ")";
    }else{
      pannelloBasso.style.backgroundColor =
        C.coloreInferiore || "#101820";
    }

  }

  /* =====================================
     TESTI
  ====================================== */

  $("titolo").innerHTML = C.titolo || "";

  document.querySelectorAll("[data-t]").forEach(function(el){

    var chiave = el.getAttribute("data-t");

    el.innerHTML = C[chiave] || "";

  });

  /* =====================================
     PULSANTE
  ====================================== */

  var bottone = $("bottone");

  bottone.textContent = C.bottoneTesto || "";

  bottone.href = C.bottoneLink || "#";

  /* =====================================
     FUNZIONE CARICAMENTO IMMAGINI
  ====================================== */

  function opz(src,imgId,alt,wrap,link){

    var img = $(imgId);

    var contenitore = wrap ? $(wrap) : img;

    if(!src){
      contenitore.hidden = true;
      return;
    }

    img.onerror = function(){
      contenitore.hidden = true;
      console.warn("Immagine non trovata:",src);
    };

    img.onload = function(){
      contenitore.hidden = false;
    };

    img.alt = alt || "";

    if(link !== undefined && contenitore.tagName === "A"){

      if(link){
        contenitore.href = link;
      }else{
        contenitore.removeAttribute("href");
      }

    }

    img.src = src;

  }

  /* Logo superiore */

  opz(
    C.logo,
    "logoImg",
    C.logoAlt,
    "logo",
    C.logoLink
  );

  /* Christmas Card */

  opz(
    C.immagineTitolo,
    "heroImg",
    C.immagineTitoloAlt
  );

  /* Logo aziendale inferiore */

  opz(
    C.logoAzienda,
    "aziendaLogo",
    C.logoAziendaAlt,
    "aziendaLogoLink",
    C.logoAziendaLink
  );

  /* =====================================
     DATI AZIENDALI
  ====================================== */

  var dati = $("dati");

  var parti = [];

  function txt(s){

    var n = document.createElement("span");

    n.textContent = s;

    return n;

  }

  function lnk(s,h){

    var a = document.createElement("a");

    a.textContent = s;

    a.href = h;

    return a;

  }

  if(C.ragioneSociale){

    var ragione = document.createElement("strong");

    ragione.textContent = C.ragioneSociale;

    parti.push(ragione);

  }

  if(C.indirizzo){
    parti.push(txt(C.indirizzo));
  }

  if(C.piva){
    parti.push(txt("P.IVA " + C.piva));
  }

  if(C.email){
    parti.push(lnk(C.email,"mailto:" + C.email));
  }

  if(C.telefono){
    parti.push(lnk(
      C.telefono,
      "tel:" + (C.telefonoLink || C.telefono)
    ));
  }

  parti.forEach(function(n,k){

    if(k){
      dati.appendChild(document.createTextNode(" · "));
    }

    dati.appendChild(n);

  });

  /* =====================================
     FAQ E CONDIZIONI
  ====================================== */

  var faq = $("linkFaq");

  var condizioni = $("linkCond");

  faq.textContent = C.testoFaq || "";

  faq.href = C.linkFaq || "#";

  condizioni.textContent = C.testoCondizioni || "";

  condizioni.href = C.linkCondizioni || "#";

})();

</script>

</body>
</html>
```
