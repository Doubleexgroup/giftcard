<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Christmas Card | Dinner in the Sky</title>
<meta name="description" content="La Christmas Card Dinner in the Sky: il regalo per chi merita un'esperienza indimenticabile.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#2fa8dc;
  --accent-hover:#4dbbea;
  --font:'Montserrat','Helvetica Neue',Arial,sans-serif;
  --top-image:none;
  --logo-height:50px;
  --company-logo-height:42px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  min-height:100%;
  background:#05070a;
}

body{
  min-height:100vh;
  min-height:100dvh;
  font-family:var(--font);
  color:#fff;
  overflow-x:hidden;
}

img{
  display:block;
  max-width:100%;
}

a{
  color:inherit;
}

:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:3px;
}

[hidden]{
  display:none!important;
}

/* =====================================================
   PAGINA
   ===================================================== */

.page{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}

/* =====================================================
   FASCIA SUPERIORE
   Immagine natalizia, logo e titolo
   ===================================================== */

.top-panel{
  position:relative;
  isolation:isolate;
  min-height:390px;
  min-height:48vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px 24px 38px;
  text-align:center;
  overflow:hidden;
  background:#101820;
}

.top-panel:before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  background-image:var(--top-image);
  background-position:center center;
  background-size:cover;
  background-repeat:no-repeat;
  transform:scale(1.02);
}

.top-panel:after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  background:linear-gradient(
    180deg,
    rgba(0,0,0,.35),
    rgba(0,0,0,.48)
  );
}

.top-logo{
  position:absolute;
  top:max(20px,env(safe-area-inset-top));
  left:max(24px,4vw);
}

.top-logo img{
  width:auto;
  height:var(--logo-height);
  filter:drop-shadow(0 2px 12px rgba(0,0,0,.5));
}

.top-content{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding-top:45px;
}

.top-content h1{
  font-size:clamp(1.8rem,4.2vw,3.8rem);
  line-height:1.16;
  font-weight:600;
  letter-spacing:.035em;
  text-transform:uppercase;
  text-shadow:0 3px 22px rgba(0,0,0,.65);
}

.top-content h1 i{
  color:var(--accent);
  font-style:italic;
}

/* =====================================================
   FASCIA CENTRALE BIANCA
   Card, pulsante e sottotitolo
   ===================================================== */

.hero-panel{
  position:relative;
  z-index:1;
  background:#fff;
  color:#15191d;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:32px 22px 38px;
  gap:18px;
}

.hero-img{
  width:auto;
  height:auto;
  max-width:min(620px,88vw);
  max-height:330px;
  object-fit:contain;
  filter:drop-shadow(0 5px 18px rgba(0,0,0,.16));
}

.cta{
  display:inline-block;
  padding:16px 42px;
  border-radius:999px;
  background:var(--accent);
  color:#fff;
  text-decoration:none;
  font-size:.82rem;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  transition:background .2s,transform .2s;
}

.cta:hover{
  background:var(--accent-hover);
  transform:translateY(-2px);
}

.lead{
  max-width:620px;
  color:#555e65;
  font-size:clamp(.9rem,1.1vw,1.08rem);
  line-height:1.6;
}

/* =====================================================
   FASCIA INFERIORE
   Stessa immagine superiore, sfocata
   ===================================================== */

.bottom-panel{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  background:#101820;
  color:#fff;
  padding:32px 0 0;
}

.bottom-panel:before{
  content:"";
  position:absolute;
  inset:-22px;
  z-index:-2;
  background-image:var(--top-image);
  background-position:center center;
  background-size:cover;
  background-repeat:no-repeat;
  filter:blur(13px);
  transform:scale(1.06);
}

.bottom-panel:after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  background:rgba(0,0,0,.58);
}

.points,
.foot{
  position:relative;
  z-index:1;
}

/* =====================================================
   I TRE PUNTI INFORMATIVI
   ===================================================== */

.points{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:28px;
  max-width:1100px;
  width:100%;
  margin:0 auto;
  padding:8px 28px 30px;
}

.points div{
  border-top:2px solid var(--accent);
  padding-top:13px;
}

.points h3{
  font-size:.92rem;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  margin-bottom:7px;
}

.points p{
  color:rgba(255,255,255,.82);
  font-size:.8rem;
  line-height:1.6;
}

/* =====================================================
   FOOTER AZIENDALE
   ===================================================== */

.foot{
  border-top:1px solid rgba(255,255,255,.18);
  padding:17px max(24px,3vw) max(16px,env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:20px;
  align-items:center;
  font-size:.74rem;
  color:rgba(255,255,255,.78);
  background:rgba(0,0,0,.18);
}

.foot .azienda-logo{
  grid-column:1;
  justify-self:start;
}

.foot .azienda-logo img{
  width:auto;
  height:var(--company-logo-height);
}

.foot .dati{
  grid-column:2;
  text-align:center;
  line-height:1.8;
}

.foot .dati strong{
  color:#fff;
  font-weight:700;
}

.foot a{
  text-decoration:none;
}

.foot a:hover{
  color:var(--accent);
  text-decoration:underline;
}

.foot .links{
  grid-column:3;
  display:flex;
  flex-direction:column;
  gap:5px;
  text-align:right;
  text-transform:uppercase;
  letter-spacing:.07em;
  font-weight:600;
}

.copy{
  grid-column:1/-1;
  text-align:center;
  font-size:.68rem;
  opacity:.65;
  border-top:1px solid rgba(255,255,255,.15);
  padding-top:10px;
}

/* =====================================================
   TABLET E SMARTPHONE
   ===================================================== */

@media(max-width:820px){

  :root{
    --logo-height:38px;
    --company-logo-height:34px;
  }

  .top-panel{
    min-height:330px;
    min-height:43vh;
    padding:80px 20px 35px;
  }

  .top-logo{
    top:18px;
    left:20px;
  }

  .top-content{
    padding-top:20px;
  }

  .top-content h1{
    font-size:clamp(1.55rem,6vw,2.5rem);
  }

  .hero-panel{
    padding:27px 18px 30px;
    gap:16px;
  }

  .hero-img{
    max-width:90vw;
    max-height:290px;
  }

  .cta{
    padding:15px 28px;
    font-size:.76rem;
  }

  .points{
    grid-template-columns:1fr;
    gap:17px;
    padding:10px 24px 25px;
  }

  .points h3{
    font-size:.85rem;
  }

  .points p{
    font-size:.76rem;
  }

  .foot{
    grid-template-columns:1fr;
    text-align:center;
    gap:12px;
    padding:18px 20px;
  }

  .foot .azienda-logo,
  .foot .dati,
  .foot .links{
    grid-column:1;
  }

  .foot .azienda-logo{
    justify-self:center;
  }

  .foot .dati{
    text-align:center;
  }

  .foot .links{
    flex-direction:row;
    justify-content:center;
    flex-wrap:wrap;
    gap:16px;
    text-align:center;
  }
}

/* =====================================================
   SCHERMI MOLTO BASSI
   ===================================================== */

@media(max-height:500px) and (min-width:821px){

  .top-panel{
    min-height:300px;
  }

  .top-content h1{
    font-size:2rem;
  }

  .hero-img{
    max-height:220px;
  }
}

/* =====================================================
   ACCESSIBILITÀ
   ===================================================== */

@media(prefers-reduced-motion:reduce){
  .cta{
    transition:none;
  }
}
</style>
</head>

<body>

<div class="page">

  <!-- =================================================
       FASCIA SUPERIORE
       ================================================= -->

  <header class="top-panel" id="topPanel">

    <a class="top-logo" id="logo" hidden>
      <img id="logoImg" alt="">
    </a>

    <div class="top-content">
      <h1 id="titolo"></h1>
    </div>

  </header>


  <!-- =================================================
       FASCIA CENTRALE BIANCA
       ================================================= -->

  <main class="hero-panel">

    <img
      class="hero-img"
      id="heroImg"
      alt=""
      hidden
    >

    <a
      class="cta"
      id="bottone"
      target="_blank"
      rel="noopener noreferrer"
    ></a>

    <p class="lead" id="sottotitolo"></p>

  </main>


  <!-- =================================================
       FASCIA INFERIORE CON SFONDO SFOCATO
       ================================================= -->

  <section class="bottom-panel">

    <div class="points">

      <div>
        <h3 id="punto1Titolo"></h3>
        <p id="punto1Testo"></p>
      </div>

      <div>
        <h3 id="punto2Titolo"></h3>
        <p id="punto2Testo"></p>
      </div>

      <div>
        <h3 id="punto3Titolo"></h3>
        <p id="punto3Testo"></p>
      </div>

    </div>


    <!-- FOOTER AZIENDALE -->

    <footer class="foot">

      <a class="azienda-logo" id="aziendaLogoLink" hidden>
        <img id="aziendaLogo" alt="">
      </a>

      <div class="dati" id="dati"></div>

      <nav class="links" aria-label="Informazioni">
        <a id="linkFaq" target="_blank" rel="noopener"></a>
        <a id="linkCond" target="_blank" rel="noopener"></a>
      </nav>

      <p class="copy" id="copyright"></p>

    </footer>

  </section>

</div>


<!-- =====================================================
     IMPOSTAZIONI
     MODIFICA QUI TESTI, IMMAGINI E LINK
     ===================================================== -->

<script>

var IMPOSTAZIONI = {

  /* IMMAGINI */

  sfondo: "IMG/Cena sospesa sul Natale di Roma.png",

  logo: "IMG/Logo Dinner in the Sky Italy_1.png",
  logoAlt: "Dinner in the Sky",
  logoLink: "https://www.dinnerinthesky.it",

  immagineTitolo: "IMG/Biglietto regalo Dinner in the Sky natalizio.png",
  immagineTitoloAlt: "Christmas Card Dinner in the Sky",

  /* DATI AZIENDA */

  logoAzienda: "IMG/Logo Dinner in the Sky Italy_1.png",
  logoAziendaAlt: "Dinner in the Sky Italia",
  logoAziendaLink: "",

  ragioneSociale: "DINNER IN THE SKY ITALIA SRL",
  indirizzo: "Via Pomarico 58, 00178 Roma (RM)",
  piva: "18589811001",
  email: "supporto@dinnerinthesky.it",
  telefono: "+39 342 798 2112",
  telefonoLink: "+393427982112",

  /* FAQ E CONDIZIONI */

  testoFaq: "FAQ",
  linkFaq: "faq.html",

  testoCondizioni: "Condizioni contrattuali",
  linkCondizioni: "condizioni.html",

  /* TITOLO E TESTI */

  titoloPagina: "Christmas Card | Dinner in the Sky",

  titolo:
    'Regala un’esperienza all’<i>ALTEZZA</i><br>di Babbo Natale',

  sottotitolo:
    "Il regalo per chi merita un'esperienza indimenticabile.",

  /* PULSANTE */

  bottoneTesto: "Acquista la Christmas Card",

  bottoneLink:
    "https://www.dinnerinthesky.it/gift-card#scegli-il-valore",

  /* I TRE PUNTI */

  punto1Titolo: "Scegli il valore",

  punto1Testo:
    "Quest'anno il valore del regalo lo scegli tu. Seleziona l'importo ideale e preparati a lasciare sotto l'albero un'emozione.",

  punto2Titolo: "Regalala subito",

  punto2Testo:
    "Come un pacco speciale che arriva a sorpresa, ma digitale: la Christmas Card entra nella casella email che scegli tu, la tua o quella di chi la riceve.",

  punto3Titolo: "Stupisci chi vuoi",

  punto3Testo:
    "Chi la scarta non riceve un oggetto, ma un'esperienza fuori dall'ordinario ed un panorama che non si dimentica.",

  /* COPYRIGHT */

  copyright:
    "© 2026 DINNER IN THE SKY ITALIA SRL · Tutti i diritti riservati"

};


/* =====================================================
   APPLICAZIONE AUTOMATICA DELLE IMPOSTAZIONI
   NON MODIFICARE QUESTA PARTE
   ===================================================== */

(function(){

  var C = IMPOSTAZIONI;

  function $(id){
    return document.getElementById(id);
  }

  /* TITOLO PAGINA */

  document.title = C.titoloPagina || "Dinner in the Sky";

  /* IMMAGINE DI SFONDO CONDIVISA TRA SOPRA E SOTTO */

  if(C.sfondo){

    var immagineSfondo = 'url("' + C.sfondo.replace(/"/g,'%22') + '")';

    document.documentElement.style.setProperty(
      "--top-image",
      immagineSfondo
    );

  }

  /* TITOLO */

  $("titolo").innerHTML = C.titolo || "";

  /* SOTTOTITOLO */

  $("sottotitolo").textContent = C.sottotitolo || "";

  /* PULSANTE */

  var bottone = $("bottone");

  bottone.textContent = C.bottoneTesto || "Acquista";
  bottone.href = C.bottoneLink || "#";

  /* FUNZIONE PER MOSTRARE LE IMMAGINI SOLO SE ESISTONO */

  function caricaImmagine(src, imgId, alt, contenitoreId, link){

    if(!src) return;

    var img = $(imgId);
    var contenitore = contenitoreId ? $(contenitoreId) : img;

    img.alt = alt || "";

    img.onload = function(){
      contenitore.hidden = false;
    };

    img.onerror = function(){
      contenitore.hidden = true;
    };

    if(contenitore.tagName === "A"){

      if(link){
        contenitore.href = link;
      }else{
        contenitore.removeAttribute("href");
      }

    }

    img.src = src;

  }

  /* LOGO IN ALTO */

  caricaImmagine(
    C.logo,
    "logoImg",
    C.logoAlt,
    "logo",
    C.logoLink
  );

  /* CARD CENTRALE */

  caricaImmagine(
    C.immagineTitolo,
    "heroImg",
    C.immagineTitoloAlt
  );

  /* LOGO AZIENDALE IN BASSO */

  caricaImmagine(
    C.logoAzienda,
    "aziendaLogo",
    C.logoAziendaAlt,
    "aziendaLogoLink",
    C.logoAziendaLink
  );

  /* TESTI DEI TRE PUNTI */

  $("punto1Titolo").textContent = C.punto1Titolo || "";
  $("punto1Testo").textContent = C.punto1Testo || "";

  $("punto2Titolo").textContent = C.punto2Titolo || "";
  $("punto2Testo").textContent = C.punto2Testo || "";

  $("punto3Titolo").textContent = C.punto3Titolo || "";
  $("punto3Testo").textContent = C.punto3Testo || "";

  /* COPYRIGHT */

  $("copyright").textContent = C.copyright || "";

  /* DATI AZIENDALI */

  var dati = $("dati");
  var parti = [];

  function aggiungiTesto(testo){
    if(!testo) return;

    var span = document.createElement("span");
    span.textContent = testo;
    parti.push(span);
  }

  function aggiungiLink(testo, indirizzo){
    if(!testo || !indirizzo) return;

    var a = document.createElement("a");
    a.textContent = testo;
    a.href = indirizzo;
    parti.push(a);
  }

  if(C.ragioneSociale){

    var strong = document.createElement("strong");
    strong.textContent = C.ragioneSociale;
    parti.push(strong);

  }

  aggiungiTesto(C.indirizzo);

  if(C.piva){
    aggiungiTesto("P.IVA " + C.piva);
  }

  if(C.email){
    aggiungiLink(C.email, "mailto:" + C.email);
  }

  if(C.telefono){
    aggiungiLink(
      C.telefono,
      "tel:" + (C.telefonoLink || C.telefono)
    );
  }

  parti.forEach(function(elemento, indice){

    if(indice > 0){
      dati.appendChild(document.createTextNode(" · "));
    }

    dati.appendChild(elemento);

  });

  /* LINK FAQ E CONDIZIONI */

  var faq = $("linkFaq");
  var condizioni = $("linkCond");

  faq.textContent = C.testoFaq || "";
  faq.href = C.linkFaq || "#";

  condizioni.textContent = C.testoCondizioni || "";
  condizioni.href = C.linkCondizioni || "#";

})();

</script>

</body>
</html>
```
