<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Condizioni contrattuali | Dinner in the Sky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--logo-height:46px;--bg:#05070a;--accent:#2fa8dc;--text:#fff;--muted:rgba(255,255,255,.75);--font:'Montserrat','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font:400 .98rem/1.75 var(--font);color:var(--text);min-height:100vh;background:radial-gradient(80% 50% at 85% 0,rgba(47,168,220,.16),transparent 70%),var(--bg)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px max(20px,3vw);border-bottom:1px solid rgba(255,255,255,.12)}
header img{height:var(--logo-height);width:auto}
header .back{text-decoration:none;font-size:.82rem;text-transform:uppercase;letter-spacing:.1em;font-weight:500;color:var(--text)}
header .back:hover{color:var(--accent)}
main{max-width:800px;margin:0 auto;padding:56px 24px 80px}
h1{font-weight:600;font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.1;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px}
.intro{color:var(--muted);margin-bottom:34px;white-space:pre-line}
details{border-top:1px solid rgba(255,255,255,.18);padding:16px 0}
details:last-of-type{border-bottom:1px solid rgba(255,255,255,.18)}
summary{cursor:pointer;font-weight:600;font-size:1rem;line-height:1.4;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font-size:1.4rem;line-height:1}
details[open] summary::after{content:"–"}
details p{margin-top:10px;color:var(--muted);white-space:pre-line}
section.cl{margin-bottom:28px}
section.cl h2{font-weight:600;font-size:1rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:6px}
section.cl p{color:var(--muted);white-space:pre-line}
footer{text-align:center;padding:24px;font-size:.78rem;opacity:.6;border-top:1px solid rgba(255,255,255,.1)}
</style>
</head>
<body>
<header>
  <a id="logoLink" hidden><img id="logo" alt=""></a>
  <a class="back" id="torna"></a>
</header>
<main>
  <h1 id="titolo"></h1>
  <p class="intro" id="intro"></p>
  <div id="contenuto"></div>
</main>
<footer id="copy"></footer>

<!-- =====================================================================
     IMPOSTAZIONI DELLA PAGINA: modifica SOLO tra gli apici.
     Per aggiungere una voce, copia una riga { ... }, incollala sotto e separala con la virgola.
     ===================================================================== -->
<script>
var PAGINA = {
  logo:       "IMG/Logo Dinner in the Sky Italy_1.png",   /* "" = nessun logo */
  logoAlt:    "Dinner in the Sky",
  logoLink:   "index.html",
  tornaTesto: "← Torna alla pagina principale",
  tornaLink:  "index.html",
  copyright:  "© 2026 DINNER IN THE SKY ITALIA SRL · Tutti i diritti riservati",
  titoloPagina: "Condizioni contrattuali",
  titolo: "Condizioni contrattuali",
  intro:  "[Scrivi qui una breve introduzione, oppure lascia vuoto]",
  sezioni: [
    { t: "1. Oggetto",      p: "[Inserisci qui il testo]" },
    { t: "2. Acquisto e consegna", p: "[Inserisci qui il testo]" },
    { t: "3. Utilizzo e validità", p: "[Inserisci qui il testo]" },
    { t: "4. Recesso e rimborsi",  p: "[Inserisci qui il testo]" },
    { t: "5. Contatti",     p: "[Inserisci qui il testo]" }
  ]
};

(function(){
  var P=PAGINA,$=function(id){return document.getElementById(id)};
  document.title=P.titoloPagina+' | Dinner in the Sky';
  $('titolo').textContent=P.titolo;
  $('intro').textContent=P.intro||'';
  $('copy').textContent=P.copyright;
  var t=$('torna');t.textContent=P.tornaTesto;t.href=P.tornaLink;
  if(P.logo){var i=$('logo'),w=$('logoLink');i.onerror=function(){w.hidden=true};i.onload=function(){w.hidden=false};i.alt=P.logoAlt;w.href=P.logoLink;i.src=P.logo}
  var box=$('contenuto');
  (P.faq||[]).forEach(function(q){
    var d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('p');
    s.textContent=q.d;p.textContent=q.r;d.appendChild(s);d.appendChild(p);box.appendChild(d)
  });
  (P.sezioni||[]).forEach(function(q){
    var s=document.createElement('section'),h=document.createElement('h2'),p=document.createElement('p');
    s.className='cl';h.textContent=q.t;p.textContent=q.p;s.appendChild(h);s.appendChild(p);box.appendChild(s)
  });
})();
</script>
</body>
</html>
